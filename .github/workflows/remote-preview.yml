name: Validate PC push preview
on:
  pull_request:
    paths:
      - 'android-app/**'
      - 'push-gateway/**'
      - 'server-plugin/**'
      - 'index.js'
      - 'remote-config.json'
      - '.github/workflows/remote-preview.yml'
concurrency:
  group: pc-push-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm ci --prefix push-gateway/functions
      - run: node -e "require('./push-gateway/functions/index.cjs')"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:assembleDebug :app:lintDebug
        working-directory: android-app
      - uses: actions/upload-artifact@v4
        with:
          name: Silly-Pop-PC-preview-unconfigured-debug
          path: android-app/app/build/outputs/apk/debug/*.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: cd android-app && gradle --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pc-push-test-reports
          path: |
            android-app/app/build/reports/
            android-app/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
