name: Publish Silly-Pop v1.3.0 and build APK

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v1.3.0.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Apply v1.3.0 source update
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/update.patch.xz
          xz -dc /tmp/update.patch.xz > /tmp/update.patch
          git apply /tmp/update.patch
          # Keep this workflow file; only publish the generated app sources.

      - name: Commit source update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Silly-Pop Android companion app"
          git push

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build test APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Silly-Pop-v0.1.0-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Silly-Pop-v0.1.0-test
          path: Silly-Pop-v0.1.0-test.apk
          if-no-files-found: error
          retention-days: 30
