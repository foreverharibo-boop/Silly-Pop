name: Build Silly-Pop Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - android-app/**
      - .github/workflows/publish-v1.3.0.yml

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Test extension and bridge
        run: npm test

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Enable KVM for Android tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test launcher switching and notification receipt on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: cd android-app && gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Preserve device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-test-reports
          path: |
            android-app/app/build/reports/androidTests/
            android-app/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Restore release signing key
        shell: bash
        env:
          SILLY_POP_KEYSTORE_BASE64: ${{ secrets.SILLY_POP_KEYSTORE_BASE64 }}
        run: |
          test -n "$SILLY_POP_KEYSTORE_BASE64"
          echo "$SILLY_POP_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/silly-pop-release.jks"

      - name: Build signed test APK
        working-directory: android-app
        env:
          SILLY_POP_SIGNING_STORE_FILE: ${{ runner.temp }}/silly-pop-release.jks
          SILLY_POP_SIGNING_PASSWORD: ${{ secrets.SILLY_POP_SIGNING_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename APK
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk Silly-Pop-v0.2.4-test.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Silly-Pop-v0.2.4-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Silly-Pop-v0.2.4-test
          path: Silly-Pop-v0.2.4-test.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.4-test
          name: Silly-Pop v0.2.4-test
          prerelease: true
          generate_release_notes: false
          body: |
            실리팝 안드로이드 알림 앱 v0.2.4 테스트 버전입니다.

            - Termux 서버의 AI 응답 수신 완료 시 알림 (웹 확장 1.5.0 / 서버 2.3.0 필요)
            - 100LOG 초안·재작성, inSTead 재작성의 서버 응답 감지
            - 브라우저 복귀 후 화면 게시에 의한 지연·중복 알림 제거
            - 알림 클릭 시 해당 주소를 처리하는 설치된 WebAPK가 확인될 때만 웹앱으로 이동
            - 웹앱이 없거나 여러 개면 아무 앱도 열지 않음, 삼성 인터넷 강제 실행 제거
            - 0.2.1 이상에서 삭제 없이 덮어 설치 가능
            - 100LOG 검수 완료 전에도 AI 응답 수신 알림이 올 수 있음
            - 인터넷, 파일, 사진, 연락처, 전화, 문자, 접근성 권한 없음
          files: Silly-Pop-v0.2.4-test.apk
