name: Build Silly-Pop Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - android-app/**
      - .github/workflows/publish-v1.3.0.yml

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Test extension and bridge
        run: npm test

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Enable KVM for Android tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test authentication, white icons and notification receipt on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: cd android-app && gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Preserve device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-test-reports
          path: |
            android-app/app/build/reports/androidTests/
            android-app/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Restore release signing key
        shell: bash
        env:
          SILLY_POP_KEYSTORE_BASE64: ${{ secrets.SILLY_POP_KEYSTORE_BASE64 }}
        run: |
          test -n "$SILLY_POP_KEYSTORE_BASE64"
          echo "$SILLY_POP_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/silly-pop-release.jks"

      - name: Build signed APK
        working-directory: android-app
        env:
          SILLY_POP_SIGNING_STORE_FILE: ${{ runner.temp }}/silly-pop-release.jks
          SILLY_POP_SIGNING_PASSWORD: ${{ secrets.SILLY_POP_SIGNING_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename APK
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk Silly-Pop-v1.0.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Silly-Pop-v1.0.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Silly-Pop-v1.0.0
          path: Silly-Pop-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Silly-Pop v1.0.0
          prerelease: false
          generate_release_notes: false
          body: |
            실리팝 안드로이드 알림 앱 v1.0.0입니다.

            - 앱과 Termux의 기기별 연결 키로 알림 요청 인증
            - 서명 없는 요청, 변조된 요청, 만료·재전송 요청 차단
            - 화이트 아이콘과 제목만 표시하는 알림 유지
            - 서버 플러그인 2.4.0 업데이트 및 재시작 필요 (웹 확장 1.5.0 유지)
            - 앱의 ‘연결 명령 복사’를 눌러 Termux 새 세션에 최초 한 번 붙여넣기
            - 연결 명령에는 비밀 키가 있으므로 공유 금지, 앱 삭제·데이터 초기화 시 다시 연결
            - 0.2.1 이상에서 삭제 없이 덮어 설치 가능
          files: Silly-Pop-v1.0.0.apk
