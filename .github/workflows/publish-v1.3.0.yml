name: Build Silly-Pop Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - android-app/**
      - .github/workflows/publish-v1.3.0.yml

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore release signing key
        shell: bash
        env:
          SILLY_POP_KEYSTORE_BASE64: ${{ secrets.SILLY_POP_KEYSTORE_BASE64 }}
        run: |
          test -n "$SILLY_POP_KEYSTORE_BASE64"
          echo "$SILLY_POP_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/silly-pop-release.jks"

      - name: Build signed test APK
        working-directory: android-app
        env:
          SILLY_POP_SIGNING_STORE_FILE: ${{ runner.temp }}/silly-pop-release.jks
          SILLY_POP_SIGNING_PASSWORD: ${{ secrets.SILLY_POP_SIGNING_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename APK
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk Silly-Pop-v0.2.1-test.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Silly-Pop-v0.2.1-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Silly-Pop-v0.2.1-test
          path: Silly-Pop-v0.2.1-test.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.1-test
          name: Silly-Pop v0.2.1-test
          prerelease: true
          generate_release_notes: false
          body: |
            실리팝 안드로이드 알림 앱 v0.2.1 테스트 버전입니다.

            - 알림을 안드로이드 기본형으로 단순화
            - 홈 화면 ST 로고 여백 확대
            - 삼성 갤럭시/Termux 브로드캐스트 응답값 호환성 수정
            - 앱 알림 권한 차단 시 정확한 오류 표시
            - 인터넷, 파일, 사진, 연락처, 전화, 문자, 접근성 권한 없음
          files: Silly-Pop-v0.2.1-test.apk
