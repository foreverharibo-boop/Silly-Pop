name: Build Silly-Pop Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - android-app/**
      - .github/workflows/publish-v1.3.0.yml

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build test APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Silly-Pop-v0.2.0-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Silly-Pop-v0.2.0-test
          path: Silly-Pop-v0.2.0-test.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-test
          name: Silly-Pop v0.2.0-test
          prerelease: true
          generate_release_notes: false
          body: |
            실리팝 안드로이드 알림 앱 v0.2.0 테스트 버전입니다.

            - 모듈형 ST 로고 적용
            - 블랙/화이트 앱 아이콘 선택
            - Termux 서버 플러그인 연결 확인 및 알림 전달 수정
            - 앱 알림 권한 차단 시 정확한 오류 표시
            - 인터넷, 파일, 사진, 연락처, 전화, 문자, 접근성 권한 없음
          files: Silly-Pop-v0.2.0-test.apk
