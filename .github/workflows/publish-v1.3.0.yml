name: Build Silly-Pop Android APK

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish configured and device-tested v1.1.0'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - android-app/**
      - .github/workflows/publish-v1.3.0.yml

permissions:
  contents: write

jobs:
  build-android:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Restore Firebase application config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.SILLY_POP_GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > android-app/app/google-services.json
          node -e "const c=require('./remote-config.json'); if(!c.gatewayUrl.startsWith('https://')) process.exit(1)"

      - name: Test extension and bridge
        run: npm test

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Enable KVM for Android tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test authentication, white icons and notification receipt on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: cd android-app && gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Preserve device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-test-reports
          path: |
            android-app/app/build/reports/androidTests/
            android-app/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Restore release signing key
        shell: bash
        env:
          SILLY_POP_KEYSTORE_BASE64: ${{ secrets.SILLY_POP_KEYSTORE_BASE64 }}
        run: |
          test -n "$SILLY_POP_KEYSTORE_BASE64"
          echo "$SILLY_POP_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/silly-pop-release.jks"

      - name: Build signed APK
        working-directory: android-app
        env:
          SILLY_POP_SIGNING_STORE_FILE: ${{ runner.temp }}/silly-pop-release.jks
          SILLY_POP_SIGNING_PASSWORD: ${{ secrets.SILLY_POP_SIGNING_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename APK
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk Silly-Pop-v1.1.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Silly-Pop-v1.1.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Silly-Pop-v1.1.0
          path: Silly-Pop-v1.1.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: Silly-Pop v1.1.0
          prerelease: false
          generate_release_notes: false
          body: |
            기존 Termux 알림에 컴퓨터 서버 → 갤럭시 푸시 연결을 추가합니다.

            - 상시 알림 없이 답장 도착 시에만 알림 표시
            - 앱에서 PC 연결 코드 복사 → 실리태번 Silly-Pop 설정에 붙여넣기
            - 기존 Termux 기기별 연결 키와 알림 기능 유지
            - 서버 플러그인 2.5.0 / 웹 확장 1.6.0 필요
            - 기존 정식 앱과 같은 서명 키로 업데이트 설치
          files: Silly-Pop-v1.1.0.apk
