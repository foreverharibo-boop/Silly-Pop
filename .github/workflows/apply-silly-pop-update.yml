name: Apply Silly-Pop v0.2.0 update

on:
  push:
    branches: [main]
    paths:
      - '0001-fix-restore-Android-notifications-and-add-icon-theme.patch'
      - '.github/workflows/apply-silly-pop-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply prepared update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am 0001-fix-restore-Android-notifications-and-add-icon-theme.patch

      - name: Test server plugin
        run: npm test

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK artifact
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Silly-Pop-v0.2.0-test.apk

      - name: Remove temporary update helpers
        run: |
          git rm 0001-fix-restore-Android-notifications-and-add-icon-theme.patch
          git rm .github/workflows/apply-silly-pop-update.yml
          git commit -m "chore: remove update helper"

      - name: Push verified update
        run: git push origin HEAD:main

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Silly-Pop-v0.2.0-test
          path: Silly-Pop-v0.2.0-test.apk
          if-no-files-found: error
          retention-days: 30
