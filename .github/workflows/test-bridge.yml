name: Test automatic notifications
on:
  push:
    branches: [main]
    paths:
      - index.js
      - server-plugin/**
      - tests/**
      - package.json
      - .github/workflows/test-bridge.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
