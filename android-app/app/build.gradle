plugins {
    id 'com.android.application'
}

def gatewayConfig = new groovy.json.JsonSlurper().parse(file('../../remote-config.json'))
def pushConfigured = file('google-services.json').exists() && gatewayConfig.gatewayUrl
if (pushConfigured) apply plugin: 'com.google.gms.google-services'

android {
    namespace 'com.foreverharibo.sillypop'
    compileSdk 35

    defaultConfig {
        applicationId 'com.foreverharibo.sillypop'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '1.1.0'
        buildConfigField 'boolean', 'PUSH_CONFIGURED', pushConfigured ? 'true' : 'false'
        buildConfigField 'String', 'PUSH_GATEWAY', groovy.json.JsonOutput.toJson(gatewayConfig.gatewayUrl ?: '')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            def signingFile = System.getenv('SILLY_POP_SIGNING_STORE_FILE')
            if (signingFile) {
                storeFile file(signingFile)
                storePassword System.getenv('SILLY_POP_SIGNING_PASSWORD')
                keyAlias 'silly-pop'
                keyPassword System.getenv('SILLY_POP_SIGNING_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.3.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'androidx.work:work-runtime:2.9.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
