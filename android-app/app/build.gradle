plugins {
    id 'com.android.application'
}

android {
    namespace 'com.foreverharibo.sillypop'
    compileSdk 35

    defaultConfig {
        applicationId 'com.foreverharibo.sillypop'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.2.7'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            def signingFile = System.getenv('SILLY_POP_SIGNING_STORE_FILE')
            if (signingFile) {
                storeFile file(signingFile)
                storePassword System.getenv('SILLY_POP_SIGNING_PASSWORD')
                keyAlias 'silly-pop'
                keyPassword System.getenv('SILLY_POP_SIGNING_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
